[tox]
envlist = py{27,35,36,37,38,39,310,311,312,313,314},pypy3,check
skip_missing_interpreters = true

[testenv]
setenv =
    PIP_DISABLE_PIP_VERSION_CHECK = 1
passenv =
    SSL_CERT_FILE
    CI
deps = -rtests/test-requirements.txt
commands =
    pytest --basetemp={envtmpdir} {posargs}

[testenv:benchmark]
description = "Run the test suite with benchmarks enabled"
deps =
    -rtests/test-requirements.txt
    pytest-benchmark
commands =
    pytest --basetemp={envtmpdir} --benchmark-enable {posargs}

[testenv:check]
description = "Run code formatting, static analysis, and spelling checks"
setenv =
    PIP_DISABLE_PIP_VERSION_CHECK = 1
deps = -rtests/style-requirements.txt
basepython = python3
commands =
    black --check --diff getmac tests setup.py
    flake8 getmac tests setup.py
    codespell --check-filenames --ignore-words-list ether,caf getmac tests/conftest.py tests/test_cli.py tests/test_getmac.py tests/test_methods.py tests/test_robustness.py setup.py README.md CHANGELOG.md SECURITY.md

[flake8]
max-line-length = 99
application-import-names = getmac
exclude = .github, .vagrant, docs, packaging, samples, scripts, *.egg-info, __pycache__, .git, .tox, .venv
ignore = E203, W503, E401, F401, E226, B902, ANN101, ANN102, T499
per-file-ignores =
    tests/*.py:ANN001,ANN002,ANN003,ANN201,ANN202
import-order-style = pycharm
show-source = True
max-complexity = 38

[pytest]
minversion = 3.4
testpaths = tests
norecursedirs = .github getmac samples scripts .git .tox .vagrant .idea .vscode dist build *.egg .* .venv
addopts =
    --tb=short
filterwarnings =
    ignore::DeprecationWarning
