# zizmor (https://docs.zizmor.sh/) is a static analysis tool for GitHub Actions workflows.
# It checks for template injection, unpinned or impostor actions, leaked credentials in
# checkouts, excessive permissions, and other workflow security problems.
# Findings go to code scanning, and the job fails on any finding.
name: Workflow security

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
  pull_request:
    paths:
      - ".github/workflows/**"
  schedule:
    - cron: "37 6 * * 3"
  workflow_dispatch:

permissions: {}

jobs:
  zizmor:
    name: Audit workflows with zizmor
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write # upload the SARIF to code scanning
      actions: read # read workflow runs for online audits
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          # Pinned so audits don't change under us. Bump it on purpose.
          version: "1.30.1"
          persona: regular
          min-severity: low
