name: CI
on:
  push:
    branches:
      - 0.9.x
  pull_request:

# Jobs only get read access to the repository
permissions:
  contents: read

# Cancel runs for older commits on the same pull request
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PIP_DISABLE_PIP_VERSION_CHECK: 1
  # The versions of pip for Python 2.7 and 3.5 warn that the Python is old
  PIP_NO_PYTHON_VERSION_WARNING: 1

jobs:
  lint:
    name: Run lint checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r tests/style-requirements.txt
      # The same commands as "tox -e check"
      - name: Check formatting with black
        run: black --check --diff getmac tests setup.py
      - name: Run flake8
        run: flake8 getmac tests setup.py
      - name: Check spelling
        run: codespell --check-filenames --ignore-words-list ether,caf getmac tests/conftest.py tests/test_cli.py tests/test_getmac.py tests/test_methods.py setup.py README.md CHANGELOG.md SECURITY.md

  # The versions of Python that the runner images still have
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.platform }}
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      # Versions available:
      # Python: https://github.com/actions/python-versions/blob/main/versions-manifest.json
      # pypy: https://downloads.python.org/pypy/versions.json
      # OS images: https://github.com/actions/runner-images
      matrix:
        platform:
          - ubuntu-24.04
        python-version:
          - "3.8"
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
          - "pypy3.9"
          - "pypy3.10"
        # Only a few jobs on Windows and macOS: the oldest and newest Python on
        # Windows, and one on macOS (macOS minutes cost ten times as much)
        include:
          - platform: windows-2025
            python-version: "3.8"
          - platform: windows-2025
            python-version: "3.13"
          - platform: macos-26
            python-version: "3.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Show platform and environment information
        run: python -c "import os, platform, sys; print(sys.version); print(platform.python_implementation(), platform.machine()); print('sys.platform:', sys.platform, 'os.name:', os.name); print(platform.uname())"
      - name: Install dependencies
        run: python -m pip install -r tests/test-requirements.txt
      - name: Run tests
        run: python -m pytest -ra

  # Python 2.7 and 3.5 to 3.7 aren't on the runner images anymore, and getmac 0.9.x
  # exists for them. They're tested in the official Python images from Docker Hub.
  test-old-pythons:
    name: Python ${{ matrix.python-version }} (container)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: python:${{ matrix.image-tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "2.7"
            image-tag: 2.7.18-buster
          - python-version: "3.5"
            image-tag: 3.5.10-buster
          - python-version: "3.6"
            image-tag: 3.6.15-bullseye
          - python-version: "3.7"
            image-tag: 3.7.17-bookworm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Show platform and environment information
        run: python -c "import os, platform, sys; print(sys.version); print(platform.python_implementation(), platform.machine()); print('sys.platform:', sys.platform, 'os.name:', os.name)"
      - name: Install dependencies
        run: python -m pip install -r tests/test-requirements.txt
      - name: Run tests
        run: python -m pytest -ra
