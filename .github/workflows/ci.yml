name: CI
on:
  - release
  - push
  - pull_request
jobs:
  lint:
    name: Run lint checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup PDM
        uses: pdm-project/setup-pdm@544d7237314ee09c256785bd360f6b30add38b37 # v4
        with:
          python-version: "3.11"
          cache: true
      - name: Install dependencies
        # NOTE: test is needed here to evaluate imports for pytest
        run: pdm sync -d -G lint,test
      - name: Run lint checks
        run: pdm run lint
  test:
    name: Run tests
    runs-on: ${{ matrix.platform }}
    # Python 3.15 is a pre-release, so failures there are reported but don't fail the workflow.
    # TODO: remove this once Python 3.15.0 is released
    continue-on-error: ${{ matrix.python-version == '3.15' }}
    strategy:
      fail-fast: false
      # Versions available:
      # pypy: https://downloads.python.org/pypy/versions.json
      # Python: https://github.com/actions/python-versions/blob/main/versions-manifest.json
      # Additional info: https://github.com/actions/setup-python/blob/main/docs/advanced-usage.md
      # OS images: https://github.com/actions/runner-images
      matrix:
        python-version:
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
          - "3.15"
        architecture:
          - x86
          - x64
          - arm64
        platform:
          - ubuntu-22.04
          - windows-latest
          - macos-latest
        exclude:
          - platform: ubuntu-22.04
            architecture: x86
          - platform: ubuntu-22.04
            architecture: arm64
          - platform: windows-latest
            architecture: arm64
          - platform: macos-latest
            architecture: x86
          - platform: macos-latest
            architecture: x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup PDM
        uses: pdm-project/setup-pdm@544d7237314ee09c256785bd360f6b30add38b37 # v4
        with:
          python-version: ${{ matrix.python-version }}
          architecture: ${{ matrix.architecture }}
          allow-python-prereleases: true
      - name: Display platform and environment information
        run: |
          python --version
          pdm run python --version
          python -c "import sys; print('sys.version: %s' % str(sys.version))"
          python -c "import sys; print('sys.platform: %s' % str(sys.platform))"
          python -c "import os; print('os.name: %s' % str(os.name))"
          python -c "import platform; print('platform.uname(): %s' % str(platform.uname()))"
      - name: Install dependencies
        run: pdm sync -d -G test
      # TODO: fix benchmark results (maybe a separate Job?)
      - name: Run tests
        run: pdm run test
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
  docs:
    name: Build HTML docs and manpage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup PDM
        uses: pdm-project/setup-pdm@544d7237314ee09c256785bd360f6b30add38b37 # v4
        with:
          python-version: "3.13"
          cache: true
      - name: Install dependencies
        run: pdm sync -d -G docs
      - name: Build docs
        run: pdm run docs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: html-docs
          path: html_docs/
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: html_docs/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: manpage
          path: manpage/getmac.1
  deploy:
    name: Publish docs to GitHub Pages
    needs: docs
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/1.0.0-wip'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

