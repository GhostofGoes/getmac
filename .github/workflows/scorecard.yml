# OpenSSF Scorecard (https://scorecard.dev/): scores the repository's supply-chain practices
# (pinned actions, token permissions, branch protection, signed releases, and so on).
# The results go to code scanning (SARIF) and to the Scorecard API, which serves the badge
# in the README.
# With publish_results, the Scorecard API only accepts a run from a restricted workflow: no
# top-level env or defaults, no workflow-level write permissions, no run steps, and only these
# actions. Keep it that way, or publishing fails.
name: Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 6 * * 3"
  branch_protection_rule:
  workflow_dispatch:

permissions: {}

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write # upload the SARIF to code scanning
      id-token: write # publish the results to the Scorecard API
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          sarif_file: results.sarif
