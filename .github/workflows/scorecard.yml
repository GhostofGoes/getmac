# OpenSSF Scorecard supply-chain security analysis: https://github.com/ossf/scorecard-action
# Results are published to the Security tab (code scanning) and to the
# public Scorecard API, which backs the badge in README.md.
name: OpenSSF Scorecard

on:
  # For the Branch-Protection check. Only the default branch is supported.
  branch_protection_rule:
  # To guarantee the Maintained check is occasionally updated.
  schedule:
    - cron: "30 1 * * 1"
  push:
    branches:
      - main
  workflow_dispatch:

# Declare default permissions as read only.
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Results can only be published from the upstream repository's default branch.
    if: github.repository == 'GhostofGoes/getmac'
    permissions:
      # Needed to upload the results to the code scanning dashboard.
      security-events: write
      # Needed to publish results and get a badge (see publish_results below).
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # Publish results to the public Scorecard API, enabling the README badge.
          publish_results: true
      # Upload the results as an artifact (useful for debugging).
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5
      # Upload the results to GitHub's code scanning dashboard.
      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          sarif_file: results.sarif
